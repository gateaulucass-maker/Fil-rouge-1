<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--BASE-->
<title>Soly · Direction artistique</title>
<meta name="description" content="Direction artistique de Soly, le cadre qui ensoleille la journée. 24 planches.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --aube:#FFFAF0; --creme:#FFF3D9; --encre:#1F1A17; --cafe:#6A5F55;
  --soleil:#FFD36E; --peche:#FFC9A3; --lilas:#C9B8F0; --ligne:#F0E3C8;
  --titre:"Lexend",system-ui,sans-serif;
  --texte:"Atkinson Hyperlegible",system-ui,sans-serif;
  --ui-bg:#F4EEE2; --ui-fg:var(--encre); --ui-mute:var(--cafe); --ui-line:#E4D8C2;
  --k:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ui-bg:#141110; --ui-fg:#FFFAF0; --ui-mute:#B5A99C; --ui-line:#2E2824; }
}
:root[data-theme="dark"]{ --ui-bg:#141110; --ui-fg:#FFFAF0; --ui-mute:#B5A99C; --ui-line:#2E2824; }

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ui-bg);color:var(--ui-fg);font-family:var(--texte);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}

/* ---------- barre ---------- */
.bar{position:fixed;inset:0 0 auto 0;height:56px;display:flex;align-items:center;gap:16px;padding:0 20px;z-index:20;
  background:color-mix(in srgb,var(--ui-bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ui-line);transition:opacity .25s}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--titre);font-weight:600;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand svg{width:22px;height:22px;flex:none}
.brand small{font-family:var(--texte);font-weight:400;font-size:13px;color:var(--ui-mute);letter-spacing:.02em}
.now{flex:1;min-width:0;font-size:14px;color:var(--ui-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.now b{color:var(--ui-fg);font-weight:700;font-variant-numeric:tabular-nums;margin-right:10px}
.tools{display:flex;gap:4px}
.tools button{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid transparent;border-radius:999px;background:none;cursor:pointer;font-size:14px}
.tools button:hover{border-color:var(--ui-line)}
.tools button[aria-pressed="true"]{background:var(--ui-fg);color:var(--ui-bg)}
.tools svg{width:18px;height:18px}
.tools kbd{font:12px var(--texte);opacity:.55}
.progress{position:fixed;left:0;top:55px;height:2px;background:var(--soleil);z-index:21;transition:width .3s ease}

/* ---------- scène ---------- */
.stage{position:fixed;inset:56px 0 0 0;overflow:auto;outline:none}
.deck{position:relative}
.cell{position:relative;width:calc(1920px * var(--k));height:calc(1080px * var(--k));overflow:hidden;border-radius:calc(14px * var(--k) + 2px)}
.slide{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform:scale(var(--k));transform-origin:0 0;
  background:var(--aube);color:var(--encre);font-family:var(--texte)}
.slide *{box-sizing:border-box}

/* mode présentation : une planche */
[data-mode="deck"] .stage{display:grid;place-items:center;overflow:hidden}
[data-mode="deck"] .deck{width:calc(1920px * var(--k));height:calc(1080px * var(--k))}
[data-mode="deck"] .cell{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s .35s;box-shadow:0 30px 80px -30px rgba(31,26,23,.35)}
[data-mode="deck"] .cell.on{opacity:1;visibility:visible;transition:opacity .35s ease}
[data-mode="deck"] .cell .num{display:none}

/* vue d'ensemble */
[data-mode="grid"] .deck{display:grid;grid-template-columns:repeat(var(--cols),calc(1920px * var(--k)));gap:28px 20px;justify-content:center;padding:32px 20px 60px}
[data-mode="grid"] .cell{cursor:pointer;overflow:visible;border-radius:0}
[data-mode="grid"] .cell .clip{position:absolute;inset:0;overflow:hidden;border-radius:10px;outline:1px solid var(--ui-line);transition:outline-color .2s,transform .2s}
[data-mode="grid"] .cell:hover .clip{outline:2px solid var(--ui-fg);transform:translateY(-2px)}
[data-mode="grid"] .cell.on .clip{outline:2px solid var(--soleil)}
.cell .num{position:absolute;left:0;top:calc(100% + 6px);font-size:12px;color:var(--ui-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cell .num b{color:var(--ui-fg);margin-right:6px;font-variant-numeric:tabular-nums}
.clip{position:absolute;inset:0;overflow:hidden}

/* lecture continue */
[data-mode="read"] .deck{display:flex;flex-direction:column;align-items:center;gap:40px;padding:32px 16px 80px}
[data-mode="read"] .cell{box-shadow:0 20px 60px -30px rgba(31,26,23,.3)}
[data-mode="read"] .cell .num{display:none}

/* flèches (présentation) */
.nav{position:fixed;top:50%;z-index:15;width:44px;height:44px;margin-top:-22px;border-radius:999px;border:1px solid var(--ui-line);
  background:color-mix(in srgb,var(--ui-bg) 80%,transparent);cursor:pointer;display:grid;place-items:center;transition:opacity .25s}
.nav svg{width:20px;height:20px}
.nav.prev{left:14px}.nav.next{right:14px}
.nav:disabled{opacity:0;pointer-events:none}
[data-mode]:not([data-mode="deck"]) .nav{display:none}

/* plein écran : interface discrète */
:fullscreen .bar, :fullscreen .nav{opacity:0}
:fullscreen .bar:hover{opacity:1}
:fullscreen .stage{inset:0}
:fullscreen .progress{top:0}

/* une seule planche (vérification) */
[data-raw] body{overflow:hidden;background:#fff}
[data-raw] .bar,[data-raw] .nav,[data-raw] .progress{display:none}
[data-raw] .stage{inset:0;overflow:hidden;display:block}
[data-raw] .cell{border-radius:0;box-shadow:none!important;opacity:1!important;visibility:visible!important}

@media (max-width:760px){
  .bar{gap:8px;padding:0 12px}
  .brand small,.tools kbd,.tools .lbl{display:none}
  .now{text-align:right}
  .nav{width:36px;height:36px;margin-top:-18px}.nav.prev{left:6px}.nav.next{right:6px}
}

/* impression / PDF : une planche par page */
@page{size:1920px 1080px;margin:0}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  .bar,.nav,.progress{display:none!important}
  .stage{position:static;overflow:visible;display:block!important}
  .deck{display:block!important;padding:0!important;width:auto!important;height:auto!important}
  .cell{position:relative!important;width:1920px!important;height:1080px!important;opacity:1!important;visibility:visible!important;
    box-shadow:none!important;border-radius:0!important;break-after:page;inset:auto!important}
  .cell .clip{outline:none!important;transform:none!important;border-radius:0!important}
  .cell .num{display:none}
  .slide{transform:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <svg viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor" d="M47 3H30A27 27 0 0 0 3 30v17h44zM53 3v44h44V30A27 27 0 0 0 70 3zM3 53v17a27 27 0 0 0 27 27h17V53z"/><path fill="#FFD36E" d="M53 53h44v17a27 27 0 0 1-27 27H53z"/></svg>
    Soly <small>Direction artistique · v2</small>
  </div>
  <div class="now" id="now"></div>
  <nav class="tools" aria-label="Affichage">
    <button id="bDeck" title="Présentation (P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="13" rx="2"/><path d="M8 21h8"/></svg><span class="lbl">Présenter</span></button>
    <button id="bGrid" title="Vue d'ensemble (G)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg><span class="lbl">Ensemble</span></button>
    <button id="bRead" title="Lecture continue (L)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="8" rx="1.5"/><rect x="4" y="14" width="16" height="7" rx="1.5"/></svg><span class="lbl">Lecture</span></button>
    <button id="bFull" title="Plein écran (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button id="bPrint" title="Exporter en PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5M4 17v3h16v-3"/></svg><span class="lbl">PDF</span></button>
  </nav>
</header>
<div class="progress" id="progress"></div>
<button class="nav prev" id="prev" aria-label="Planche précédente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 5-7 7 7 7"/></svg></button>
<button class="nav next" id="next" aria-label="Planche suivante"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 5 7 7-7 7"/></svg></button>

<main class="stage" id="stage" tabindex="-1">
<div class="deck" id="deck">
<!--SLIDES-->
</div>
</main>

<script>
(() => {
  const root = document.documentElement, stage = document.getElementById('stage'), deck = document.getElementById('deck');
  const slides = [...deck.querySelectorAll(':scope > .slide')];
  const pad = n => String(n).padStart(2, '0');
  // chaque planche dans une cellule mise à l'échelle
  const cells = slides.map((s, i) => {
    const c = document.createElement('div'); c.className = 'cell'; c.dataset.i = i;
    const clip = document.createElement('div'); clip.className = 'clip';
    s.replaceWith(c); clip.appendChild(s); c.appendChild(clip);
    const n = document.createElement('div'); n.className = 'num';
    n.innerHTML = '<b>' + pad(i + 1) + '</b>' + (s.dataset.title || '');
    c.appendChild(n);
    c.addEventListener('click', () => { if (root.dataset.mode === 'grid') { go(i); setMode('deck'); } });
    return c;
  });
  const N = cells.length;
  let cur = 0;
  const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

  function fit() {
    const mode = root.dataset.mode;
    if (root.hasAttribute('data-raw')) { root.style.setProperty('--k', 1); return; }
    const W = stage.clientWidth, H = stage.clientHeight;
    let k;
    if (mode === 'deck') {
      const m = W < 760 ? 12 : 72;
      k = Math.min((W - m * 2) / 1920, (H - (W < 760 ? 24 : 56)) / 1080);
    } else if (mode === 'grid') {
      const cols = W < 600 ? 1 : W < 1000 ? 2 : W < 1500 ? 3 : 4;
      root.style.setProperty('--cols', cols);
      k = (W - 40 - 20 * (cols - 1)) / cols / 1920;
    } else {
      k = Math.min(W - 32, 1600) / 1920;
    }
    root.style.setProperty('--k', Math.max(k, .05).toFixed(4));
  }

  function show() {
    cells.forEach((c, i) => c.classList.toggle('on', i === cur));
    const t = slides[cur].dataset.title || '';
    document.getElementById('now').innerHTML = '<b>' + pad(cur + 1) + ' / ' + pad(N) + '</b>' + t;
    document.getElementById('progress').style.width = ((cur + 1) / N * 100) + '%';
    document.getElementById('prev').disabled = cur === 0;
    document.getElementById('next').disabled = cur === N - 1;
    const h = '#' + pad(cur + 1);
    if (location.hash !== h) history.replaceState(null, '', h);
  }
  function go(i) { cur = Math.max(0, Math.min(N - 1, i)); show(); }

  function setMode(m) {
    root.dataset.mode = m; store.set('soly-da-mode', m);
    [['bDeck','deck'],['bGrid','grid'],['bRead','read']].forEach(([id, v]) => document.getElementById(id).setAttribute('aria-pressed', m === v));
    fit();
    if (m !== 'deck') requestAnimationFrame(() => cells[cur].scrollIntoView({ block: m === 'grid' ? 'center' : 'start' }));
    stage.focus({ preventScroll: true });
  }

  // lecture continue : la planche visible devient la courante
  const io = new IntersectionObserver(es => {
    if (root.dataset.mode !== 'read') return;
    es.forEach(e => { if (e.isIntersecting) { cur = +e.target.dataset.i; show(); } });
  }, { root: stage, threshold: .55 });
  cells.forEach(c => io.observe(c));

  document.getElementById('prev').onclick = () => go(cur - 1);
  document.getElementById('next').onclick = () => go(cur + 1);
  document.getElementById('bDeck').onclick = () => setMode('deck');
  document.getElementById('bGrid').onclick = () => setMode(root.dataset.mode === 'grid' ? 'deck' : 'grid');
  document.getElementById('bRead').onclick = () => setMode('read');
  document.getElementById('bFull').onclick = toggleFull;
  document.getElementById('bPrint').onclick = () => window.print();
  function toggleFull() { if (document.fullscreenElement) document.exitFullscreen(); else root.requestFullscreen && root.requestFullscreen(); }

  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const m = root.dataset.mode, k = e.key;
    if (k === 'g' || k === 'G') setMode(m === 'grid' ? 'deck' : 'grid');
    else if (k === 'p' || k === 'P' || (k === 'Escape' && m === 'grid')) setMode('deck');
    else if (k === 'l' || k === 'L') setMode('read');
    else if (k === 'f' || k === 'F') toggleFull();
    else if (m === 'deck') {
      if (['ArrowRight','ArrowDown','PageDown',' '].includes(k)) { e.preventDefault(); go(cur + 1); }
      else if (['ArrowLeft','ArrowUp','PageUp'].includes(k)) { e.preventDefault(); go(cur - 1); }
      else if (k === 'Home') go(0); else if (k === 'End') go(N - 1);
    }
  });

  // glisser au doigt
  let x0 = null;
  stage.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', e => {
    if (x0 === null || root.dataset.mode !== 'deck') return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) go(cur + (dx < 0 ? 1 : -1));
  });
  // clic sur la planche : avancer (moitié droite) ou reculer (moitié gauche)
  deck.addEventListener('click', e => {
    if (root.dataset.mode !== 'deck' || e.target.closest('a,button')) return;
    const r = deck.getBoundingClientRect();
    go(cur + (e.clientX - r.left > r.width / 3 ? 1 : -1));
  });

  addEventListener('resize', fit);
  addEventListener('hashchange', () => { const n = parseInt(location.hash.slice(1), 10); if (n) go(n - 1); });
  const n0 = parseInt(location.hash.slice(1), 10);
  cur = n0 && n0 <= N ? n0 - 1 : 0;
  setMode(root.hasAttribute('data-raw') ? 'deck' : (store.get('soly-da-mode') || 'deck'));
  show();
})();
</script>
</body>
</html>
