# Sources de la veille. Une URL n'est ajoutée qu'après avoir été testée.

google_alerts:
  # Une alerte Google par code requis, livrée en flux RSS (google.com/alerts > Livrer à : flux RSS).
  # Remplacer chaque REMPLACER par l'URL du flux. Les entrées REMPLACER sont ignorées.
  - {nom: alerte-M1, code: M1, requete: "marché silver économie objets connectés", url: REMPLACER}
  - {nom: alerte-M2, code: M2, requete: "seniors vivant à domicile projections INSEE", url: REMPLACER}
  - {nom: alerte-C1, code: C1, requete: "téléassistance OR \"détection de chute\" seniors", url: REMPLACER}
  - {nom: alerte-C2, code: C2, requete: "téléassistance prix abonnement", url: REMPLACER}
  - {nom: alerte-C3, code: C3, requete: "silver tech startup échec OR succès", url: REMPLACER}
  - {nom: alerte-C4, code: C4, requete: "silver tech levée de fonds OR rachat OR liquidation", url: REMPLACER}
  - {nom: alerte-C5, code: C5, requete: "objet connecté senior promesse réalité test", url: REMPLACER}
  - {nom: alerte-U3, code: U3, requete: "téléassistance abandon port du bracelet", url: REMPLACER}
  - {nom: alerte-T1, code: T1, requete: "détection de chute capteur radar IA limites", url: REMPLACER}
  - {nom: alerte-R1, code: R1, requete: "CNIL données de santé objets connectés", url: REMPLACER}
  - {nom: alerte-R2, code: R2, requete: "dispositif médical ou bien-être logiciel ANSM", url: REMPLACER}
  - {nom: alerte-R3, code: R3, requete: "AI Act obligations transparence haut risque", url: REMPLACER}
  - {nom: alerte-R4, code: R4, requete: "propriété intellectuelle application no-code marque INPI", url: REMPLACER}

medias:
  # Testés le 2026-10-01 (HTTP 200 + entrées présentes)
  - {nom: maddyness, url: "https://www.maddyness.com/feed/"}
  - {nom: frenchweb, url: "https://www.frenchweb.fr/feed"}
  - {nom: silvereco, url: "https://www.silvereco.fr/feed/"}
  - {nom: cnil, url: "https://www.cnil.fr/fr/rss.xml"}

reddit:
  # Flux RSS publics. Reddit limite fortement le débit (HTTP 429) : en cas d'échec,
  # le flux est signalé dans le bilan et retenté au run suivant.
  - {nom: r-nocode, sub: nocode, url: "https://www.reddit.com/r/nocode/.rss"}
  - {nom: r-agingparents, sub: AgingParents, url: "https://www.reddit.com/r/AgingParents/.rss"}
  - {nom: r-caregiversupport, sub: CaregiverSupport, url: "https://www.reddit.com/r/CaregiverSupport/.rss"}

app_store:
  # Flux public d'avis Apple : https://itunes.apple.com/fr/rss/customerreviews/id=<app_id>/sortBy=mostRecent/json
  # app_id vérifiés via l'API de recherche iTunes le 2026-10-01.
  pays: fr
  apps:
    - {nom: Famileo, app_id: "1018182135", famille: lien_familial}
    - {nom: "Tous FAMiliés", app_id: "6447434484", famille: lien_familial}
    - {nom: Life360, app_id: "384830320", famille: localisation_famille}
    - {nom: Signia, app_id: "1316911473", famille: audition}

google_play:
  # Pas d'API publique gratuite et pas de scraping : collecte manuelle.
  # Procédure : lire les avis sur la fiche Play Store, recopier un extrait anonymisé
  # dans un JSON et l'envoyer à scripts/add_items.py avec "origine": "avis_app".

donnees_entreprises:
  # Consultation ciblée par l'agent collecteur pour C1 et C4 uniquement, jamais d'extraction massive.
  sites: [pappers.fr, societe.com, crunchbase.com]
  codes: [C1, C4]

recherche_web:
  # 2 à 3 requêtes par code, lancées par l'agent collecteur (WebSearch).
